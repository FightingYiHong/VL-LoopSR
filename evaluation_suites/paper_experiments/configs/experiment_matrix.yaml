paper_source: main.pdf (2026-08-11 build)
paper_title: Multimodal reasoning and agentic evaluation enable self-refining symbolic regression
method_name: VEGA-SR
method_entrypoint: scripts/vega_sr.py

common_protocol:
  constant_fitting_split: fitting
  candidate_selection_split: validation
  final_reporting_split: held_out_test_or_ood
  ground_truth_visible_during_inference: false
  near_perfect_fit: held_out_test_r2 > 0.999
  strict_symbolic_recovery: simplify(prediction - target) == 0
  random_seed: 42
  outputs: runs/paper_experiments
  logs: logs/paper_experiments
  selection:
    early_stop_validation_mse: 1.0e-10
    near_tie_relative_tolerance: 0.03
    near_tie_absolute_tolerance: 1.0e-8
    internal_complexity_weight: 0.05
    constant_optimizer: scipy_least_squares

main_experiments:
  "01_standard_recovery":
    paper_figure: Fig. 2
    question: held-out numerical accuracy and simplified expression complexity
    cases:
      llmsrbench: 240
      srbench_feynman: 417
      srsd: 238
      total: 895
    methods: [vega_sr, pse, pysr, llm_sr, dso, gplearn, icsr]
    primary_metrics: [test_r2_gt_0.999_count, test_nmse, simplified_tree_nodes]

  "02_ood_extrapolation":
    paper_figure: Fig. 3a
    dataset: Constructed62
    cases:
      total: 62
      one_dimensional: 43
      two_dimensional: 19
      samples: {fitting: 256, validation: 128, ood: 512}
    methods: [vega_sr, pysr, pyoperon, rils_rols, llm_sr, dso, ffx, bingo, deap, gplearn]
    primary_metrics: [ood_r2_gt_0.999_rate, id_nmse, ood_nmse, nonfinite_rate]

  "03_high_dimensional_distractors":
    paper_figure: Fig. 3b-c
    construction:
      formulas: 24
      dimensions: [200, 500, 1000]
      regimes: [independent_irrelevant, correlated_proxy, nonlinear_decoy]
      total_cases: 216
      true_variables_per_case: [2, 5]
      samples: {fitting: 512, validation: 256, test: 1024}
      output_noise_std: 0.01 * std_y
    methods: [vega_sr, pse, pysr, pyoperon, llm_sr, dso, gplearn, physo]
    vega_sr_case_budget_sec: 900
    primary_metrics: [true_variable_recall, false_discovery_rate, median_test_mse]

  "04_noise_robustness":
    paper_figure: Fig. 3d
    dataset: NoiseSR-20
    construction:
      formulas: 20
      input_range: [-2, 2]
      relative_noise_levels: [0, 0.001, 0.01]
      seeds_per_formula_noise: 3
      total_cases: 180
      samples: {fitting: 512, validation: 256, clean_test: 1024}
    primary_metrics: [strict_symbolic_recovery, clean_test_r2, clean_test_nmse, simplified_tree_nodes]

  "05_multimodal_input":
    paper_figure: Fig. 4
    dataset: balanced_variable_interference_96
    comparison: [numeric_only, numeric_plus_one_image]
    paired_tasks: 96
    samples: {fitting: 128, validation: 128, test: 1024}
    matched_budget:
      initial_candidates: 12
      refinement_rounds: 1
      refinement_candidates: 4
      total_expression_evaluations_per_condition: 1596
      case_budget_sec: 90
    primary_metrics: [mean_test_nmse, mean_final_ned, true_variable_recall, false_discovery_rate, mean_tree_nodes]

  "06_agentic_evaluation":
    paper_figure: Fig. 5
    dataset: balanced_variable_interference_96
    comparison: [initial_evaluation_only, complete_agentic_loop]
    paired_tasks: 96
    fixed: [task_files, splits, model_version, search_budget]
    case_budget_sec: 600
    primary_metrics: [true_variable_recall, mean_held_out_test_mse]

  "07_candidate_coverage":
    paper_figure: Fig. 6
    source: stored_candidate_sequences_from_01_standard_recovery
    tasks_per_method: 895
    methods: [vega_sr, pse, pysr, dso, gplearn]
    candidate_budgets: [1, 100]
    success: first_stored_candidate_with_held_out_test_r2 > 0.999
    test_scores_used_during_search: false
    primary_metrics: [cumulative_tasks_solved_by_budget, final_selected_tasks_solved]

supplementary_experiments:
  proposer_sft:
    analysis_status: descriptive_archived_comparison
    causal_checkpoint_claim: false
    reason: intended matched SFT-side run was incomplete
    reported_task_pairs: 895
    corpus:
      examples: 10000
      unique_tasks: 5000
      proposal_examples: 5000
      refinement_examples: 5000
      train_eval_split: [9800, 200]
    base_model: Qwen3-VL-32B-Instruct

  component_ablation:
    dataset: balanced_variable_interference_96
    matched_tasks: 96
    variants: [full, without_observer, without_critic, without_proposer]
    case_budget_sec: 600

  multivariable_feynman_audit:
    source: standard_recovery_srbench_feynman
    selection: equations_with_at_least_5_observed_variables
    tasks: 34
