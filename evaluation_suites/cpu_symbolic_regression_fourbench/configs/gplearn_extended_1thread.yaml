model:
  output_dir: './gplearn_extended_1thread/'
  kwargs:
    population_size: 2400
    generations: 120
    stopping_criteria: 1.0e-10
    const_range: !!python/tuple [-20.0, 20.0]
    p_crossover: 0.68
    p_subtree_mutation: 0.12
    p_hoist_mutation: 0.05
    p_point_mutation: 0.1
    warm_start: False
    max_samples: 0.95
    verbose: False
    parsimony_coefficient: 0.002
    function_set: ['add', 'sub', 'mul', 'div', 'sqrt', 'sin', 'cos', 'log', 'exp']
    n_jobs: 1
data:
  max_train_rows: 5000
runtime:
  max_fit_seconds: 1800
