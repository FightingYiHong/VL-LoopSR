model:
  kwargs:
    population_size: 200
    stack_size: 32
    operators:
      - "+"
      - "-"
      - "*"
      - "/"
      - sin
      - cos
      - exp
      - log
      - sqrt
    use_simplification: true
    crossover_prob: 0.35
    mutation_prob: 0.45
    metric: mse
    clo_alg: lm
    clo_threshold: 1.0e-6
    max_time: 180
    max_evals: 20000
    evolutionary_algorithm: AgeFitnessEA
data:
  max_train_rows: 2000
runtime:
  max_fit_seconds: 220
