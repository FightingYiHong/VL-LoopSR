fit:
  procs: 2
  populations: 4
  population_size: 36
  ncyclesperiteration: 80
  niterations: 40
  timeout_in_seconds: 60
  maxsize: 30
  binary_operators: ['+', '-', '*', '/']
  unary_operators: ['sin', 'cos', 'exp', 'log', 'sqrt']
  nested_constraints:
    sin:
      sin: 0
      cos: 0
    cos:
      sin: 0
      cos: 0
    exp:
      exp: 0
    log:
      log: 0
    sqrt:
      sqrt: 0
  progress: false
  weight_randomize: 0.1
  precision: 32
  warm_start: false
  turbo: true
  update: false
  model_selection: best
