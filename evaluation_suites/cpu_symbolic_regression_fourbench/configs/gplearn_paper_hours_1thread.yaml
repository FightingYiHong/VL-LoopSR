model:
  output_dir: './gplearn_paper_hours_1thread/'
  kwargs:
    population_size: 4000
    generations: 900
    stopping_criteria: 1.0e-12
    const_range: [-30.0, 30.0]
    p_crossover: 0.68
    p_subtree_mutation: 0.12
    p_hoist_mutation: 0.05
    p_point_mutation: 0.1
    warm_start: False
    max_samples: 0.95
    verbose: False
    parsimony_coefficient: 0.0015
    function_set: ['add', 'sub', 'mul', 'div', 'sqrt', 'sin', 'cos', 'log', 'exp']
    n_jobs: 1
data:
  max_train_rows: 10000
runtime:
  max_fit_seconds: 21600
